# Mantem o projeto Supabase gratuito ativo (ele pausa apos 7 dias sem atividade).
# Uma chamada diaria a funcao "saude", que faz uma leitura minima no banco.
# A chave usada e a PUBLICA (anon), a mesma que ja esta no site.
name: manter-supabase-ativo

on:
  schedule:
    - cron: "17 9 * * *" # todo dia 06:17 (Brasilia)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: apps/web/js/config.js
          sparse-checkout-cone-mode: false
      - name: Chamar a funcao saude
        run: |
          URL=$(grep -o 'https://[a-z0-9]*\.supabase\.co' apps/web/js/config.js)
          KEY=$(grep -o 'SUPABASE_ANON_KEY = "[^"]*"' apps/web/js/config.js | cut -d'"' -f2)
          for tentativa in 1 2 3; do
            if curl -fsS --max-time 30 "$URL/functions/v1/saude" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"; then
              echo; exit 0
            fi
            sleep 20
          done
          echo "::error::funcao saude nao respondeu"; exit 1
